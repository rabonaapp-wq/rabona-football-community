<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabona | حسابي</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rabona.css">
<style>
.wrap{max-width:720px;margin:auto;padding:0 0 calc(var(--bar) + 28px + env(safe-area-inset-bottom))}
.cover{height:170px}
.cover .num{position:absolute;z-index:3;inset-inline-end:16px;bottom:8px;font-size:96px;line-height:1;color:rgba(245,245,245,.12)}
.head{padding:0 16px;margin-top:-52px;position:relative;z-index:4;display:flex;align-items:flex-end;gap:14px}
.head .av{width:100px;height:100px;font-size:40px;border:4px solid var(--black);border-radius:30px;transform:skewX(-4deg)}
.head .av>span{transform:skewX(4deg)}
.head .pos{margin-bottom:6px}
.nm{font-size:24px;font-weight:800;margin:12px 16px 0;display:flex;align-items:center;gap:8px}
.meta{color:var(--muted);font-size:14px;margin:4px 16px 0;display:flex;gap:6px;align-items:center}
.meta svg{width:16px;height:16px}
.bio{margin:10px 16px 0;line-height:1.7;font-size:15px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:16px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px}
.stats div{padding:12px 0;text-align:center}.stats b{display:block;font-size:20px}.stats span{font-size:12.5px;color:var(--muted)}
.stats div+div{border-inline-start:1px solid var(--line)}
.acts{display:flex;gap:10px;margin:14px 16px 0}
.acts .btn{height:44px}.acts .btn:first-child{flex:1}
/* season stats card */
.season{margin:18px 16px 0;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:linear-gradient(150deg,#0f3d22,#0b0b0b 70%);position:relative}
.season .top2{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 0;position:relative;z-index:1}
.season .top2 .h{font-size:15px}.season .top2 small{color:var(--muted);font-size:12px}
.season .g{display:grid;grid-template-columns:repeat(4,1fr);padding:10px 8px 16px;position:relative;z-index:1}
.season .g div{text-align:center;padding:6px 0}
.season .g div+div{background:linear-gradient(var(--line),var(--line)) no-repeat 0 50%/1px 60%}
.season .g .num{font-size:34px;line-height:1.1}
.season .g .num.hi{color:var(--green)}
.season .g span.l{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.info{display:flex;flex-wrap:wrap;gap:8px;margin:14px 16px 0}
.info span{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:13.5px;color:var(--muted)}
.info b{color:var(--white);font-weight:700}
.tabs{display:flex;margin-top:18px;border-bottom:1px solid var(--line);position:sticky;top:calc(var(--top) + env(safe-area-inset-top));background:var(--black);z-index:5}
.tabs button{flex:1;height:46px;color:var(--muted);font-weight:500;border-bottom:2.5px solid transparent}
.tabs button.on{color:var(--green);border-color:var(--green);font-weight:700}
.pane{display:none;padding:14px 16px}.pane.on{display:block}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.photos .pic{aspect-ratio:1;border-radius:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.card .t{font-size:12px;color:var(--muted);margin-bottom:6px}
.card p{line-height:1.7;font-size:15px}
.card .l{display:flex;gap:16px;margin-top:10px;font-size:13px;color:var(--muted)}
.card.m{padding:0;overflow:hidden}.card.m .pic{height:170px}.card.m .b{padding:14px}
.subc{display:flex;align-items:center;gap:12px}
.subc .lg{width:52px;height:52px;border-radius:14px;font-size:22px}
.subc .x{flex:1;font-size:13px;color:var(--muted)}.subc b{display:block;color:var(--white);font-size:16px}
.subc .x .num{font-size:14px;color:var(--white)}
.ok{font-size:12px;font-weight:700;color:#04170B;background:var(--green);border-radius:6px;padding:2px 8px}
.menu{margin:18px 16px 0;background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.menu a,.menu button{display:flex;width:100%;align-items:center;gap:12px;padding:14px;font-size:15px;text-align:start}
.menu a+button{border-top:1px solid var(--line)}
.menu svg{color:var(--muted)}.out{color:#FF5252}.out svg{color:#FF5252}
.sk-h{height:20px;margin:12px 16px 0}
@media (hover:hover){.menu a:hover,.menu button:hover{background:var(--surface2)}}
@media (min-width:768px){.wrap{padding-bottom:40px}.cover{border-radius:0 0 20px 20px;height:200px}.btn{padding:0 28px}.acts .btn:first-child{flex:0 0 auto}}

.colL,.colR{display:contents}
@media (min-width:1024px){
.wrap{max-width:1180px;display:grid;grid-template-columns:320px minmax(0,1fr);grid-template-rows:auto 1fr;gap:20px 24px;align-items:start;padding:24px 28px 40px}
.colL{display:block;grid-column:1;grid-row:1;background:var(--surface);border:1px solid var(--line);border-radius:20px;overflow:hidden;padding-bottom:18px}
.colR{display:block;grid-column:2;grid-row:1/span 2}
.menu{grid-column:1;grid-row:2;margin:0}
.cover{height:150px;border-radius:0}
.colL .stats{background:var(--black)}
.colR .season,.colR .info{margin-inline:0}.colR .season{margin-top:0}
.colR .pane{padding-inline:0}
}

</style>
</head>
<body>
<main class="wrap">
  <div class="colL">
  <div class="cover pic diag" id="cover"><span class="num" id="jersey"></span></div>
  <section class="head">
    <div id="av"></div>
    <span class="tag pos" id="posTag"></span>
  </section>
  <h1 class="nm"><span id="name"></span></h1>
  <p class="meta"><svg class="i"><use href="#pin"/></svg><span id="city"></span></p>
  <p class="bio" id="bio"></p>

  <div class="stats">
    <div><b class="num" id="s-posts"></b><span>منشور</span></div>
    <div><b class="num" id="s-fol"></b><span>متابِع</span></div>
    <div><b class="num" id="s-ing"></b><span>بيتابع</span></div>
  </div>
  <div class="acts">
    <button class="btn" onclick="location.href='edit-profile.html'">تعديل الملف الشخصي</button>
    <button class="btn ghost" onclick="location.href='new-post.html'">منشور جديد</button>
  </div>

  </div>
  <div class="colR">
  <section class="season" id="season"></section>
  <div class="info" id="info"></div>

  <div class="tabs" id="tabs">
    <button class="on" data-p="p1">المنشورات</button>
    <button data-p="p2">الصور</button>
    <button data-p="p3">اشتراكاتي</button>
  </div>
  <section class="pane on" id="p1"></section>
  <section class="pane" id="p2"><div class="photos" id="photos"></div></section>
  <section class="pane" id="p3"></section>
  </div>

  <div class="menu">
    <a href="settings.html"><svg class="i"><use href="#gear"/></svg>الإعدادات</a>
    <button class="out" onclick="Rabona.sendToApp({type:'logout'})"><svg class="i"><use href="#out"/></svg>تسجيل الخروج</button>
  </div>
</main>

<script src="rabona.js"></script>
<script>
const {ic,art,av}=Rabona,$=id=>document.getElementById(id);
Rabona.chrome('profile');

// TODO: load from Firestore (users/{uid}). Placeholder data below.
const me={name:'أحمد محمود',city:'القاهرة، مصر',bio:'مهاجم صريح، بحب أسجل وأصنع الفرص. هدفي أوصل للدوري الممتاز.',number:9,photo:'',cover:'',
 posts:[{t:'من 3 أيام',x:'ماتش النهاردة خلص 3-1 وسجلت هدفين. الحمد لله ⚽',l:96,c:14,img:1},{t:'من أسبوع',x:'تمرين الصبح مع أكاديمية النجوم. الشغل التقيل بيدي نتيجة.',l:54,c:6}],
 photos:6,followers:482,following:127,
 season:{label:'موسم 2026',matches:24,goals:18,assists:7,rating:7.8},
 info:[['المركز','مهاجم'],['السن','16 سنة'],['الطول','174 سم'],['القدم','اليمنى']],
 subs:[{n:'أكاديمية النجوم',price:800,next:'التجديد 1 نوفمبر'}]};

$('cover').insertAdjacentHTML('afterbegin',me.cover?`<img src="${me.cover}" alt="">`:art(21));
$('jersey').textContent=me.number;$('jersey').className='over num';
$('av').innerHTML=av(me.name,9,100,me.photo);
$('posTag').textContent='مهاجم';
$('name').textContent=me.name;$('city').textContent=me.city;$('bio').textContent=me.bio;
$('s-posts').textContent=me.posts.length;$('s-fol').textContent=me.followers;$('s-ing').textContent=me.following;
const s=me.season;
$('season').classList.add('diag');
$('season').innerHTML=`<div class="top2"><h2 class="h">إحصائيات اللعب</h2><small>${s.label}</small></div>
 <div class="g"><div><span class="num">${s.matches}</span><span class="l">ماتش</span></div>
 <div><span class="num hi">${s.goals}</span><span class="l">هدف</span></div>
 <div><span class="num">${s.assists}</span><span class="l">تمريرة حاسمة</span></div>
 <div><span class="num">${s.rating}</span><span class="l">التقييم</span></div></div>`;
$('info').innerHTML=me.info.map(i=>`<span>${i[0]}: <b>${i[1]}</b></span>`).join('');
$('p1').innerHTML=me.posts.map((p,k)=>`<div class="card ${p.img?'m':''}">${p.img?`<div class="pic">${art(40+k)}</div><div class="b">`:''}<div class="t">${p.t}</div><p>${p.x}</p><div class="l"><span>${p.l} إعجاب</span><span>${p.c} تعليق</span></div>${p.img?'</div>':''}</div>`).join('');
$('photos').innerHTML=Array.from({length:me.photos},(_,i)=>`<div class="pic">${art(60+i)}</div>`).join('');
$('p3').innerHTML=me.subs.length?me.subs.map(x=>`<div class="card subc">${av(x.n,1,52).replace('class="av"','class="av lg"')}<div class="x"><b>${x.n}</b><span class="num">${x.price}</span> ج / شهر · ${x.next}</div><span class="ok">نشط</span></div>`).join(''):`<div class="card"><p>لسه مشتركتش في أي أكاديمية. <a href="academies.html" style="color:var(--green);font-weight:700">شوف الأكاديميات</a></p></div>`;
$('tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;document.querySelectorAll('#tabs button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.pane').forEach(p=>p.classList.toggle('on',p.id===b.dataset.p))};
</script>
</body>
</html>
