<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabona | منشور جديد</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;800&family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="rabona.css">
<style>
.wrap{max-width:640px;margin:auto;padding:18px 16px calc(var(--bar) + 32px + env(safe-area-inset-bottom))}
@media (min-width:1024px){.wrap{padding-bottom:40px}}
h1.h{font-size:24px;margin-bottom:14px}
.box{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.who{display:flex;align-items:center;gap:12px}
.who .av{width:44px;height:44px;font-size:18px}
.who b{display:block}.who small{color:var(--muted);font-size:12.5px}
.who select{margin-inline-start:auto;height:36px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);padding:0 10px;color-scheme:dark;font-size:14px}
textarea{color:var(--white);font-family:inherit;width:100%;min-height:130px;resize:none;background:none;border:0;outline:0;font-size:17px;line-height:1.8;margin-top:12px;overflow:hidden}
textarea::placeholder{color:#8A8A8A}
.cnt{display:flex;justify-content:space-between;color:var(--muted);font-size:12.5px}
.cnt .num{font-size:12.5px}.cnt .warn{color:var(--amber)}
.imgs{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.imgs:empty{display:none}
.im{position:relative;aspect-ratio:4/3;border-radius:12px;overflow:hidden;background:var(--surface2)}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im button{position:absolute;top:6px;inset-inline-start:6px;width:30px;height:30px;border-radius:50%;background:rgba(0,0,0,.7);font-size:18px;line-height:1}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-top:1px solid var(--line);margin-top:12px;padding-top:12px}
.tl{height:38px;padding:0 14px;border-radius:19px;background:var(--surface2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:6px;font-size:14px}
.tl svg.i{width:18px;height:18px;color:var(--green)}
.tl.on{border-color:var(--green);color:var(--green)}
.em{font-size:20px;width:38px;height:38px;border-radius:50%}
.em:hover{background:var(--surface2)}
.opt{display:flex;align-items:center;gap:12px;padding:14px 0 0}
.opt .t{flex:1}.opt .t small{display:block;color:var(--muted);font-size:12.5px}
.sw{width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:var(--white);transition:transform .15s}
.sw[aria-checked=true]{background:var(--green)}.sw[aria-checked=true]::after{transform:translateX(-18px)}
.score{display:none;margin-top:12px;background:var(--surface2);border-radius:12px;padding:12px}
.score.on{display:block}
.score .row{display:flex;align-items:center;gap:10px;justify-content:center}
.score input{width:72px;height:56px;text-align:center;font-size:26px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);outline:0;direction:ltr}
.score input:focus,.score .cp:focus{border-color:var(--green)}
.score label{display:grid;gap:4px;text-align:center;color:var(--muted);font-size:12.5px}
.score em{font-style:normal;color:var(--green);font-size:24px;margin-top:18px}
.score .cp{width:100%;margin-top:10px;height:42px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);padding:0 12px;outline:0;font-size:15px}
.err{color:var(--err);font-size:13.5px;margin-top:12px;min-height:1px}
.acts{display:flex;gap:10px;margin-top:16px}.acts .btn{flex:1}
.acts .btn:disabled{opacity:.6;cursor:not-allowed}
.done{display:none;text-align:center;padding:50px 10px}
.done.on{display:block}
.done .ok{width:72px;height:72px;border-radius:50%;background:var(--green);color:#04170B;display:grid;place-items:center;margin:0 auto 14px}
.done .ok svg{width:36px;height:36px;stroke:currentColor;fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.done p{color:var(--muted);margin:6px 0 20px}
.toast{position:fixed;inset-inline:16px;bottom:calc(var(--bar) + 16px + env(safe-area-inset-bottom));max-width:360px;margin:auto;background:var(--surface2);border:1px solid var(--line);font-weight:700;padding:10px 16px;border-radius:12px;z-index:60;text-align:center}
@media (min-width:1024px){.toast{bottom:24px}}
</style>
</head>
<body>
<main class="wrap">
  <section id="form">
    <h1 class="h">منشور جديد</h1>
    <div class="box">
      <div class="who"><div id="meAv"></div><div><b id="meName"></b><small>بتنشر دلوقتي</small></div>
        <select id="aud" aria-label="مين يشوف المنشور"><option value="all">الكل</option><option value="fol">المتابعين</option><option value="me">أنا بس</option></select></div>
      <textarea id="txt" maxlength="500" placeholder="شارك صورة أو خبر عن لعبك يا كابتن…" aria-label="نص المنشور"></textarea>
      <div class="cnt"><span id="draft"></span><span class="num" id="cnt">0 / 500</span></div>
      <div class="imgs" id="imgs"></div>
      <input type="file" id="file" accept="image/*" multiple hidden>
      <div class="tools">
        <button class="tl" id="addImg" type="button"><svg class="i"><use href="#plus"/></svg>صور <span class="num" id="imgN" style="font-size:12px">0/4</span></button>
        <button class="tl" id="scoreBtn" type="button" aria-expanded="false"><svg class="i"><use href="#ball"/></svg>نتيجة ماتش</button>
        <span style="flex:1"></span>
        <span id="ems"></span>
      </div>
      <div class="score" id="score">
        <div class="row"><label>ليهم<input id="sThem" type="number" min="0" max="99" inputmode="numeric"></label><em>–</em><label>لينا<input id="sUs" type="number" min="0" max="99" inputmode="numeric"></label></div>
        <input class="cp" id="sComp" maxlength="30" placeholder="البطولة (اختياري) مثال: دوري الناشئين" aria-label="البطولة">
      </div>
      <div class="opt"><div class="t"><b>السماح بالتعليقات</b><small id="cmNote"></small></div><button class="sw" id="cm" role="switch" aria-checked="true" aria-label="السماح بالتعليقات"></button></div>
      <p class="err" id="err" role="alert"></p>
      <div class="acts"><button class="btn ghost" id="cancel" type="button">إلغاء</button><button class="btn" id="pub" type="button" disabled>انشر</button></div>
    </div>
  </section>

  <section class="done" id="done">
    <div class="ok"><svg viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg></div>
    <h1 class="h" style="justify-content:center">اتنشر منشورك</h1>
    <p>هيظهر لمتابعينك دلوقتي.</p>
    <div class="acts" style="max-width:360px;margin:auto"><a class="btn" href="index.html">الرئيسية</a><button class="btn ghost" id="again" type="button">منشور تاني</button></div>
  </section>
</main>

<script src="rabona.js"></script>
<script>
const {ic,av,sendToApp}=Rabona,$=id=>document.getElementById(id);
Rabona.chrome('');

// TODO: replace with users/{uid}. Upload images to Firebase Storage, then create the post document.
const ME='أحمد محمود',MAXI=4,MAXMB=5,DRAFT='rabona-draft';
let prefs={};try{prefs=JSON.parse(localStorage.getItem('rabona-settings')||'{}')}catch(e){}
let files=[],busy=false,score=false,comments=true,t0;

$('meAv').innerHTML=av('أحمد',9,44);$('meName').textContent=ME;
// defaults come from settings.html
$('aud').value=prefs.private?'fol':({all:'all',fol:'fol',me:'me'}[prefs.whoPosts]||'all');
comments=prefs.whoComment!=='off';
const toast=t=>{const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.append(d);setTimeout(()=>d.remove(),2200)};
const setCm=()=>{$('cm').setAttribute('aria-checked',comments);$('cmNote').textContent=comments?'اللي يقدر يعلّق حسب إعدادات الخصوصية':'التعليقات مقفولة على المنشور ده'};
setCm();
$('ems').innerHTML=['⚽','🔥','👏','💪','🏆'].map(e=>`<button class="em" type="button" data-e="${e}" aria-label="${e}">${e}</button>`).join('');

/* draft (text only) */
try{const d=localStorage.getItem(DRAFT);if(d){$('txt').value=d;$('draft').textContent='مسودة محفوظة'}}catch(e){}
function grow(){const t=$('txt');t.style.height='auto';t.style.height=Math.max(130,t.scrollHeight)+'px'}
function state(){
  const n=$('txt').value.length;
  $('cnt').textContent=n+' / 500';$('cnt').className='num'+(n>=450?' warn':'');
  $('pub').disabled=busy||(!$('txt').value.trim()&&!files.length);
  $('imgN').textContent=files.length+'/'+MAXI;
}
$('txt').oninput=()=>{grow();state();clearTimeout(t0);t0=setTimeout(()=>{try{localStorage.setItem(DRAFT,$('txt').value);$('draft').textContent='مسودة محفوظة'}catch(e){}},500)};
$('ems').onclick=e=>{const b=e.target.closest('[data-e]');if(!b)return;const t=$('txt');t.setRangeText(b.dataset.e,t.selectionStart,t.selectionEnd,'end');t.focus();t.oninput()};

/* images */
function drawImgs(){
  $('imgs').innerHTML=files.map((f,i)=>`<div class="im"><img src="${f.url}" alt="صورة ${i+1}"><button type="button" data-i="${i}" aria-label="حذف الصورة ${i+1}">×</button></div>`).join('');
  state();
}
$('addImg').onclick=()=>files.length<MAXI?$('file').click():toast('أقصى عدد صور '+MAXI);
$('file').onchange=e=>{
  let msg='';
  for(const f of e.target.files){
    if(files.length>=MAXI){msg='أقصى عدد صور '+MAXI+'.';break}
    if(!f.type.startsWith('image/')){msg='"'+f.name+'" مش صورة.';continue}
    if(f.size>MAXMB*1048576){msg='"'+f.name+'" أكبر من '+MAXMB+' ميجا.';continue}
    files.push({f,url:URL.createObjectURL(f)});
  }
  e.target.value='';$('err').textContent=msg;drawImgs();
};
$('imgs').onclick=e=>{const b=e.target.closest('[data-i]');if(!b)return;const [x]=files.splice(+b.dataset.i,1);URL.revokeObjectURL(x.url);drawImgs()};

/* score + comments */
$('scoreBtn').onclick=()=>{score=!score;$('score').classList.toggle('on',score);$('scoreBtn').classList.toggle('on',score);$('scoreBtn').setAttribute('aria-expanded',score);if(score)$('sUs').focus()};
$('cm').onclick=()=>{comments=!comments;setCm()};

/* publish */
function check(){
  if(!$('txt').value.trim()&&!files.length)return 'اكتب حاجة أو ضيف صورة.';
  if(score){const a=$('sUs').value,b=$('sThem').value;
    if(a===''||b===''||!(+a>=0&&+a<=99&&+b>=0&&+b<=99&&Number.isInteger(+a)&&Number.isInteger(+b)))return 'اكتب نتيجة الماتش بأرقام من 0 لـ 99.'}
  return '';
}
$('pub').onclick=()=>{
  if(busy)return;
  const e=check();$('err').textContent=e;if(e)return;
  busy=true;$('pub').disabled=true;$('pub').textContent='بينشر…';
  const post={text:$('txt').value.trim(),audience:$('aud').value,comments,
    score:score?{us:+$('sUs').value,them:+$('sThem').value,competition:$('sComp').value.trim()}:null,
    images:files.map(x=>({name:x.f.name,size:x.f.size,type:x.f.type})),createdAt:Date.now()};
  // TODO: upload files to Storage, then addDoc(posts). Simulated delay for now.
  sendToApp({type:'create_post',post});
  setTimeout(()=>{
    try{localStorage.removeItem(DRAFT)}catch(e){}
    files.forEach(x=>URL.revokeObjectURL(x.url));
    $('form').style.display='none';$('done').classList.add('on');scrollTo(0,0);
  },600);
};
$('again').onclick=()=>{
  files=[];busy=false;score=false;$('txt').value='';$('sUs').value=$('sThem').value=$('sComp').value='';$('score').classList.remove('on');$('scoreBtn').classList.remove('on');
  $('draft').textContent='';$('pub').textContent='انشر';$('err').textContent='';drawImgs();grow();
  $('done').classList.remove('on');$('form').style.display='';$('txt').focus();
};
$('cancel').onclick=()=>{
  const dirty=$('txt').value.trim()||files.length;
  if(dirty&&!confirm('تسيب المنشور؟ النص هيفضل محفوظ كمسودة، لكن الصور مش هتتحفظ.'))return;
  history.length>1?history.back():location.href='index.html';
};
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)&&!$('pub').disabled)$('pub').click()});
grow();state();
</script>
</body>
</html>
